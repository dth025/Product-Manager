<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Product Manager</title>

  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111827;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at top left,#4338ca 0%,transparent 25%),
        radial-gradient(circle at bottom right,#0ea5e9 0%,transparent 25%),
        var(--bg);

      color:var(--text);
      min-height:100vh;
      padding:30px;
    }

    .container{
      max-width:1300px;
      margin:auto;
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:30px;
      border-radius:30px;
      background:var(--card);
      backdrop-filter: blur(20px);
      border:1px solid var(--border);
      box-shadow:0 10px 40px rgba(0,0,0,0.35);
    }

    header h1{
      font-size:2.7rem;
      margin-bottom:8px;
    }

    header p{
      color:var(--muted);
      max-width:600px;
      line-height:1.7;
    }

    .logo{
      font-size:4rem;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      backdrop-filter: blur(18px);
      border-radius:28px;
      padding:28px;
      box-shadow:0 12px 30px rgba(0,0,0,0.25);
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .stat-box{
      padding:24px;
      border-radius:22px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      transition:0.3s;
    }

    .stat-box:hover{
      transform:translateY(-6px);
    }

    .stat-box h3{
      color:var(--muted);
      margin-bottom:12px;
      font-size:1rem;
    }

    .stat-box p{
      font-size:2rem;
      font-weight:700;
    }

    .search-box{
      margin-bottom:20px;
    }

    .search-box input{
      width:100%;
      padding:16px;
      border:none;
      outline:none;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:1rem;
    }

    .product-form{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .product-field{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .product-field label{
      color:var(--muted);
      font-size:0.95rem;
    }

    .product-form input{
      padding:14px 16px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:0.95rem;
      transition:0.25s;
    }

    .product-form input:focus{
      background:rgba(255,255,255,0.12);
      box-shadow:0 0 0 3px rgba(99,102,241,0.35);
    }

    .actions{
      grid-column:1/-1;
      display:flex;
      justify-content:flex-end;
      gap:12px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:14px 20px;
      font-weight:600;
      transition:0.25s;
    }

    .primary{
      background:linear-gradient(135deg,#6366f1,#4f46e5);
      color:white;
    }

    .primary:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(99,102,241,0.4);
    }

    .secondary{
      background:rgba(255,255,255,0.08);
      color:white;
    }

    .secondary:hover{
      background:rgba(255,255,255,0.12);
    }

    .table-wrapper{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1000px;
    }

    thead{
      background:rgba(255,255,255,0.06);
    }

    th{
      padding:18px;
      color:#cbd5e1;
      text-align:left;
    }

    td{
      padding:18px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    tbody tr{
      transition:0.25s;
    }

    tbody tr:hover{
      background:rgba(255,255,255,0.05);
    }

    table img{
      width:72px;
      height:72px;
      border-radius:18px;
      object-fit:cover;
      border:2px solid rgba(255,255,255,0.1);
    }

    .product-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .product-actions button{
      padding:10px 16px;
      border-radius:12px;
      color:white;
      font-size:0.9rem;
    }

    .edit{
      background:#14b8a6;
    }

    .delete{
      background:var(--danger);
    }

    .stock-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 14px;
      border-radius:999px;
      font-size:0.8rem;
      font-weight:600;
    }

    .in-stock{
      background:rgba(34,197,94,0.15);
      color:#4ade80;
    }

    .low-stock{
      background:rgba(245,158,11,0.15);
      color:#fbbf24;
    }

    .out-stock{
      background:rgba(239,68,68,0.15);
      color:#f87171;
    }

    #status{
      margin-top:18px;
      text-align:center;
      color:#4ade80;
      font-weight:600;
      min-height:24px;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:40px;
      font-size:1.1rem;
    }

    @media(max-width:768px){
      body{
        padding:16px;
      }

      header{
        flex-direction:column;
        text-align:center;
      }

      header h1{
        font-size:2rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div>
      <h1>Product Manager</h1>
      <p>
        Modern dashboard quản lý sản phẩm với Node.js, Express,
        MongoDB và Redis.
      </p>
    </div>

    <div class="logo">
      📦
    </div>
  </header>

  <div class="stats">

    <div class="stat-box">
      <h3>Tổng sản phẩm</h3>
      <p id="total-products">0</p>
    </div>

    <div class="stat-box">
      <h3>Tổng số lượng</h3>
      <p id="total-quantity">0</p>
    </div>

    <div class="stat-box">
      <h3>Tổng</h3>
      <p id="total-revenue">0₫</p>
    </div>

  </div>

  <div class="card">

    <form class="product-form" id="product-form">

      <div class="product-field">
        <label>Tên sản phẩm</label>
        <input type="text" id="name" required />
      </div>

      <div class="product-field">
        <label> Mã sản phẩm</label>
        <input type="text" id="sku" required />
      </div>

      <div class="product-field">
        <label>Ngày nhập</label>
        <input type="date" id="entryDate" required />
      </div>

      <div class="product-field">
        <label>Giá vốn</label>
        <input type="number" id="costPrice" required />
      </div>

      <div class="product-field">
        <label>Giá bán</label>
        <input type="number" id="price" required />
      </div>

      <div class="product-field">
        <label>Số lượng</label>
        <input type="number" id="quantity" required />
      </div>

      <div class="product-field">
        <label>Ảnh sản phẩm</label>
        <input type="text" id="imageUrl" />
      </div>

      <div class="actions">
        <button class="primary" type="submit" id="submit-btn">
          Thêm sản phẩm
        </button>

        <button
          class="secondary"
          type="button"
          id="cancel-btn"
          style="display:none;"
          onclick="cancelEdit()"
        >
          Hủy
        </button>
      </div>

    </form>

    <div id="status"></div>

  </div>

  <div class="card">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Tìm kiếm sản phẩm..."
      />
    </div>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Ảnh</th>
            <th>Tên</th>
            <th>Mã sản phẩm</th>
            <th>Ngày nhập</th>
            <th>Giá vốn</th>
            <th>Giá bán</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody id="product-list">
          <tr>
            <td colspan="8" class="empty">
              Loading...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>

<script>

let editingProductId = null;

document
  .getElementById('product-form')
  .addEventListener('submit', submitProductForm);

async function loadProducts() {

  const list = document.getElementById('product-list');

  list.innerHTML = `
    <tr>
      <td colspan="8" class="empty">
        Loading...
      </td>
    </tr>
  `;

  try {

    const res = await fetch('/api/products');
    const data = await res.json();

    if (!data || data.length === 0) {

      list.innerHTML = `
        <tr>
          <td colspan="8" class="empty">
            No products found.
          </td>
        </tr>
      `;

      return;
    }

    list.innerHTML = '';

    document.getElementById('total-products').textContent =
      data.length;

    const totalQty = data.reduce(
      (sum,p)=>sum + (p.quantity || 0),0
    );

    document.getElementById('total-quantity').textContent =
      totalQty;

    const totalRevenue = data.reduce(
      (sum,p)=>sum + ((p.price || 0)*(p.quantity || 0)),0
    );

    document.getElementById('total-revenue').textContent =
      totalRevenue.toLocaleString() + '₫';

    data.forEach(p => {

      let stockBadge = '';

      if (p.quantity > 10) {
        stockBadge =
          `<span class="stock-badge in-stock">
            Còn hàng
          </span>`;
      }
      else if (p.quantity > 0) {
        stockBadge =
          `<span class="stock-badge low-stock">
            Còn hàng
          </span>`;
      }
      else {
        stockBadge =
          `<span class="stock-badge out-stock">
            Hết hàng
          </span>`;
      }

      const row = document.createElement('tr');

      row.innerHTML = `
        <td>
          <img src="${p.imageUrl || 'https://via.placeholder.com/70'}">
        </td>

        <td>${p.name}</td>

        <td>${p.sku || ''}</td>

        <td>
          ${new Date(p.entryDate).toLocaleDateString()}
        </td>

        <td>
          ${(p.costPrice || 0).toLocaleString()}₫
        </td>

        <td>
          ${(p.price || 0).toLocaleString()}₫
        </td>

        <td>
          ${stockBadge}
        </td>

        <td class="product-actions">

          <button
            class="edit"
            onclick="startEditProduct('${p._id}')"
          >
            Sửa
          </button>

          <button
            class="delete"
            onclick="deleteProduct('${p._id}')"
          >
            Xóa
          </button>

        </td>
      `;

      list.appendChild(row);

    });

  }
  catch(err){

    list.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          Failed to load products.
        </td>
      </tr>
    `;

    console.error(err);

  }
}

async function submitProductForm(event){

  event.preventDefault();

  const payload = {

    name:
      document.getElementById('name').value.trim(),

    sku:
      document.getElementById('sku').value.trim(),

    entryDate:
      document.getElementById('entryDate').value,

    costPrice:
      parseFloat(document.getElementById('costPrice').value),

    price:
      parseFloat(document.getElementById('price').value),

    quantity:
      parseInt(document.getElementById('quantity').value),

    imageUrl:
      document.getElementById('imageUrl').value.trim()

  };

  try {

    let res;

    if(editingProductId){

      res = await fetch(
        '/api/products/' + editingProductId,
        {
          method:'PUT',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify(payload)
        }
      );

    } else {

      res = await fetch(
        '/api/products',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify(payload)
        }
      );

    }

    if(!res.ok){

      const errText = await res.text();
      throw new Error(errText);

    }

    document.getElementById('status').textContent =
      editingProductId
      ? '✅ Cập nhật sản phẩm thành công.'
      : '✅ Thêm sản phẩm thành công.';

    resetForm();

    loadProducts();

  }
  catch(err){

    alert('Error: ' + err.message);
    console.error(err);

  }
}

async function deleteProduct(id){

  if(!confirm('Delete this product?')) return;

  try {

    const res = await fetch(
      '/api/products/' + id,
      {
        method:'DELETE'
      }
    );

    if(!res.ok){

      throw new Error('Delete failed');

    }

    document.getElementById('status').textContent =
      '🗑️ Product deleted successfully.';

    loadProducts();

  }
  catch(err){

    alert(err.message);

  }
}

async function startEditProduct(id){

  try {

    const res = await fetch('/api/products/' + id);
    const p = await res.json();

    editingProductId = id;

    document.getElementById('name').value =
      p.name || '';

    document.getElementById('sku').value =
      p.sku || '';

    document.getElementById('entryDate').value =
      p.entryDate?.split('T')[0] || '';

    document.getElementById('costPrice').value =
      p.costPrice || '';

    document.getElementById('price').value =
      p.price || '';

    document.getElementById('quantity').value =
      p.quantity || '';

    document.getElementById('imageUrl').value =
      p.imageUrl || '';

    document.getElementById('submit-btn').textContent =
      'Cập nhật sản phẩm';

    document.getElementById('cancel-btn').style.display =
      'inline-block';

  }
  catch(err){

    alert('Failed to load product.');

  }
}

function cancelEdit(){

  resetForm();

}

function resetForm(){

  editingProductId = null;

  document.getElementById('product-form').reset();

  document.getElementById('submit-btn').textContent =
    'Thêm sản phẩm';

  document.getElementById('cancel-btn').style.display =
    'none';

}

document
  .getElementById('searchInput')
  .addEventListener('input', function(){

    const keyword =
      this.value.toLowerCase();

    const rows =
      document.querySelectorAll('#product-list tr');

    rows.forEach(row => {

      row.style.display =
        row.innerText.toLowerCase().includes(keyword)
        ? ''
        : 'none';

    });

  });

loadProducts();

</script>

</body>
</html>
