<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo tồn kho</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="stock">
  <div class="container">
    <header>
      <div>
        <h1>Báo cáo tồn kho</h1>
        <p>Xem tổng số lượng, giá trị tồn và những sản phẩm cần bổ sung.</p>
      </div>
      <div class="logo">📊</div>
    </header>

    <div class="navbar" id="nav-links">
      <a href="./index.html" data-page="dashboard">Dashboard</a>
      <a href="./products.html" data-page="products">Sản phẩm</a>
      <a href="./stock-report.html" data-page="stock">Tồn kho</a>
      <a href="./transactions.html" data-page="transactions">Giao dịch</a>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h3>Tổng sản phẩm</h3>
        <p id="report-total-products">0</p>
      </div>
      <div class="stat-box">
        <h3>Tổng số lượng</h3>
        <p id="report-total-quantity">0</p>
      </div>
      <div class="stat-box">
        <h3>Tổng giá trị tồn</h3>
        <p id="report-total-value">0₫</p>
      </div>
    </div>

    <div class="card">
      <h2>Sản phẩm sắp hết</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Tên</th>
              <th>SKU</th>
              <th>Số lượng</th>
            </tr>
          </thead>
          <tbody id="low-stock-list"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Sản phẩm đã hết hàng</h2>
      <div class="table-wrapper">
        <table>
          <tbody id="out-of-stock-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./js/shared.js" defer></script>
  <script src="./js/stock-report.js" defer></script>
</body>
</html>
